[alembic]
script_location = %(here)s/python/migration_env
version_locations = %(here)s/python/migrations
prepend_sys_path = %(here)s/python
path_separator = os

# Website account database (PostgreSQL): alembic -n webapp upgrade head
[webapp]
script_location = %(here)s/python/webapp/migrations
version_locations = %(here)s/python/webapp/migrations/versions
prepend_sys_path = %(here)s/python
path_separator = os

[alembic]
script_location = %(here)s/python/migration_env
version_locations = %(here)s/python/migrations
prepend_sys_path = %(here)s/python
path_separator = os

# Website account database (PostgreSQL): alembic -n webapp upgrade head.
# ASCII comments preserve compatibility with Alembic's Windows locale reader.
[webapp]
script_location = %(here)s/python/webapp/migrations
version_locations = %(here)s/python/webapp/migrations/versions
prepend_sys_path = %(here)s/python
path_separator = os

# Memory business tables: separate versions in research.memory_alembic_version.
[memory]
script_location = %(here)s/python/chainscope_research/memory/migrations
version_locations = %(here)s/python/chainscope_research/memory/migrations/versions
prepend_sys_path = %(here)s/python
path_separator = os

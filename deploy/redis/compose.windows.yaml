# 用途：Windows 受限直连的端口发布配置，与 compose.yaml 同时使用。
# 必须先加载来源限制，再应用本文件；TLS、账号、内存与持久化设置沿用基础配置。
# 保留 Linux 本机入口，同时只在指定 VMware IPv4 地址发布，不监听全部网卡或 IPv6。
# !override 明确替换基础 ports 列表，避免环境变量或合并规则产生额外监听地址。
# 后续管理本部署时继续同时传入两个 -f 参数；只使用基础配置会回到本机访问模式。
services:
  cache:
    ports: !override
      - "127.0.0.1:6379:6379"
      - "192.168.229.10:6379:6379"
  coordination:
    ports: !override
      - "127.0.0.1:6380:6379"
      - "192.168.229.10:6380:6379"

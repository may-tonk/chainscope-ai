# 用途：Redis 所在 Linux 宿主机的持久化运行参数；不是 Redis 实例配置。
# 安装位置：/etc/sysctl.d/90-chainscope-redis.conf。
# Redis 在 AOF 重写时需要 fork 后台进程；按官方建议允许内存申请，减少启发式检查拒绝 fork。
# 这会改变整台虚拟机的内存申请策略，不会提前占用物理内存，也不会增加实际可用内存。
# Docker 容器的 1024 MiB / 512 MiB 硬上限仍分别生效；不能据此承诺永不发生内存不足。
# 用 sysctl -p 加载本文件，无需重启主机；不要用此文件覆盖其他已有 sysctl 配置。
vm.overcommit_memory = 1

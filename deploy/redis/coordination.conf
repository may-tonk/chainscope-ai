# 用途：保存任务协调数据，包括队列、限流和去重锁；不承担完整报告或链上事实存储。
# 本文件不保存密码、私钥。长期任务记录及幂等恢复仍需在后续业务层实现。

# 容器内部使用与缓存实例相同的 TLS 端口，宿主机通过 Compose 映射到 6380。
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/chainscope/tls/server.crt
tls-key-file /run/chainscope/tls/server.key
tls-ca-cert-file /run/chainscope/tls/ca.crt
tls-protocols "TLSv1.2 TLSv1.3"
tls-auth-clients no
aclfile /run/chainscope/users.acl

daemonize no
logfile ""
loglevel notice
dir /data
databases 1

# 达到内存阈值时拒绝需要新增内存的写入，避免把待执行任务当成普通缓存淘汰。
# 整个容器另设 512 MiB 上限，为运行开销和 AOF 重写留出余量。
maxmemory 128mb
maxmemory-policy noeviction

# AOF 每秒同步；异常故障仍可能损失约一秒写入，不能替代任务持久化和幂等处理。
# AOF 自动重写用于控制日志增长，其磁盘与内存峰值必须在实际运行中监测。
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
# 不静默接受截断日志；发生损坏时显式报错，由受控恢复流程处理。
aof-load-truncated no
# 关闭定时 RDB；AOF 重写仍允许使用 RDB 格式前导，这与定时快照不同。
save ""
aof-use-rdb-preamble yes

# 队列只传任务 ID 和必要参数；消费者与生产者的连接总量需一起核算。
maxclients 64
timeout 0
tcp-keepalive 60
client-query-buffer-limit 8mb
client-output-buffer-limit normal 8mb 2mb 60
client-output-buffer-limit pubsub 8mb 2mb 60

# 用途：Docker 每次启动之前先恢复 Redis 来源限制，避免重启后端口失去保护。
# 安装位置：/etc/systemd/system/docker.service.d/20-chainscope-redis-firewall.conf。
# 这是新增的独立 drop-in，不覆盖既有 windows-proxy.conf，也不清空已有 ExecStartPre。
# 脚本失败会阻止整个 Docker 服务启动，必须先修复；当前安装与 daemon-reload 不重启 Docker。
[Service]
ExecStartPre=/usr/local/sbin/chainscope-redis-firewall.sh

# 用途：保存可重新计算的分析结果；原始交易、完整报告和长期业务记录不存入本实例。
# 这是部署配置，证书和 ACL 另行在 Linux 准备；本文件不保存密码或私钥。

# 容器内监听所有 IPv4 地址；宿主机是否对外开放由 Compose 端口发布和防火墙控制。
# 关闭明文端口，仅提供 TLS；启用保护模式不替代 ACL、证书校验和来源限制。
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/chainscope/tls/server.crt
tls-key-file /run/chainscope/tls/server.key
tls-ca-cert-file /run/chainscope/tls/ca.crt
tls-protocols "TLSv1.2 TLSv1.3"
# 客户端通过 ACL 用户名/密码认证；此处不要求客户端另持一张 mTLS 证书。
tls-auth-clients no
aclfile /run/chainscope/users.acl

# Redis 前台运行，由 Docker 管理生命周期与日志轮转。
daemonize no
logfile ""
loglevel notice
dir /data
databases 1

# 512 MiB 是 Redis 淘汰判断的初始阈值，整个容器的上限另设为 1024 MiB。
# 超限时淘汰最近较少访问的键；业务代码仍必须为缓存设置合理的 TTL。
maxmemory 512mb
maxmemory-policy allkeys-lru

# 缓存可以从持久化数据重新计算，重启后允许为空，不启用 AOF 或定时快照。
appendonly no
save ""

# 先限制连接及缓冲规模；这些是服务保护线，不代表应用可以无限增加 worker。
maxclients 64
timeout 0
tcp-keepalive 60
client-query-buffer-limit 8mb
client-output-buffer-limit normal 8mb 2mb 60
client-output-buffer-limit pubsub 8mb 2mb 60

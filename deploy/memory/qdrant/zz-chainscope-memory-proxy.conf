# 用途：让 Docker 使用 SSH 转发的 Windows 本机代理，不把代理开放到局域网。
# 由 python/tools/memory/run_memory_tunnel.py 的运行副本维持 Linux 127.0.0.1:17890 的转发监听。
# 这是整个 Docker daemon 的代理；拉取镜像时需要 Windows 代理及 SSH 转发在线。
# NO_PROXY 仅控制哪些目标直连，不是数据库地址或云端 Embedding 的 Base URL。
[Service]
Environment="HTTP_PROXY=http://127.0.0.1:17890"
Environment="HTTPS_PROXY=http://127.0.0.1:17890"
Environment="NO_PROXY=localhost,127.0.0.1,::1,192.168.229.0/24"

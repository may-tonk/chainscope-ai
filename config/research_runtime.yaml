# 决策和正文共享整轮截止与次数；没有 SDK、图节点等其他自动重试层。
# 修改后重新装配/重启研究应用；不新增记忆、数据库或后台研究任务。

# 整轮模型处理截止，单位秒，范围 1～1000；主备切换不会重新计时。
# 消费事件较慢也会消耗剩余轮次时间，但不会在消费方代码中强制触发取消。
turn_timeout_seconds: 1000
# 历史消息正文的累计字符上限，范围 1000～100000；不是模型 token 上下文上限。
# 本步未实现自动摘要；超过此值直接拒绝，不静默丢弃用户条件。
max_input_characters: 32000
# 最终正文累计字符上限，范围 1000～100000，与 max_tokens 各自生效。
max_output_characters: 64000
# 每个阶段最多尝试次数，1 或 2：2 表示主模型一次、备用一次，不是重试两次。
# fallback_enabled=false 时仍只调用主模型；这里填 2 不会凭空创建备用。
max_attempts_per_stage: 2
# 决策与正文合计的供应商尝试次数，范围 2～4，失败也计入。
# 正常决策一次＋正文一次共 2；两阶段都切换则共 4。
# 设为 2 时，若决策阶段已耗完两次，正文会因共享预算不足而明确结束。
max_attempts_per_turn: 4
